# SHY-downloader 配置文件

# 下载目录（可修改为你想要的路径）
download_dir: "~/Desktop/videos"

# 微信视频号配置
wechat_channels:
  # Online API（零配置，优先使用）
  online_api: true
  
  # Yuanbao API（需要 Cookie）
  yuanbao:
    enabled: false
    cookie: ""  # 从浏览器 DevTools 获取
  
  # Go Binary Proxy Mode
  go_binary:
    enabled: false
    path: "~/aigit/wx_channels_download/wx_channels_download"
    config_path: "~/aigit/wx_channels_download/config.yaml"

# 通用下载设置
general:
  max_video_mb: 2000  # 单视频最大大小（MB）
  timeout: 3600       # 超时时间（秒）
  retries: 3          # 重试次数
  
# ASR 设置
asr:
  enabled: true
  backend: "siliconflow"  # siliconflow | whisper | auto
  language: "zh"

# 批量下载设置
batch:
  enabled: true
  follow_mode: true  # 是否追踪博主所有视频
